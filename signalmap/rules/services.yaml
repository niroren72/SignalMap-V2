# Service Classifier Rules
# Maps hostname patterns to friendly service names and categories.
# Categories: finance, crm, dev, comms, cloud, cdn, other

services:
  # Development
  - pattern: "*.github.com"
    name: "GitHub"
    category: "dev"
  - pattern: "github.com"
    name: "GitHub"
    category: "dev"
  - pattern: "*.githubusercontent.com"
    name: "GitHub"
    category: "dev"
  - pattern: "registry.npmjs.org"
    name: "npm"
    category: "dev"
  - pattern: "pypi.org"
    name: "PyPI"
    category: "dev"
  - pattern: "*.pypi.org"
    name: "PyPI"
    category: "dev"
  - pattern: "docker.io"
    name: "Docker Hub"
    category: "dev"
  - pattern: "*.docker.io"
    name: "Docker Hub"
    category: "dev"
  - pattern: "sentry.io"
    name: "Sentry"
    category: "dev"
  - pattern: "*.sentry.io"
    name: "Sentry"
    category: "dev"

  # Communication
  - pattern: "*.slack.com"
    name: "Slack"
    category: "comms"
  - pattern: "slack.com"
    name: "Slack"
    category: "comms"
  - pattern: "*.teams.microsoft.com"
    name: "Microsoft Teams"
    category: "comms"
  - pattern: "*.office365.com"
    name: "Microsoft 365"
    category: "comms"
  - pattern: "smtp.gmail.com"
    name: "Gmail"
    category: "comms"
  - pattern: "imap.gmail.com"
    name: "Gmail"
    category: "comms"
  - pattern: "*.twilio.com"
    name: "Twilio"
    category: "comms"

  # CRM
  - pattern: "*.salesforce.com"
    name: "Salesforce"
    category: "crm"
  - pattern: "*.force.com"
    name: "Salesforce"
    category: "crm"

  # Finance
  - pattern: "*.blackline.com"
    name: "BlackLine"
    category: "finance"
  - pattern: "*.stripe.com"
    name: "Stripe"
    category: "finance"
  - pattern: "api.stripe.com"
    name: "Stripe"
    category: "finance"

  # Cloud
  - pattern: "*.amazonaws.com"
    name: "AWS"
    category: "cloud"
  - pattern: "*.aws.amazon.com"
    name: "AWS"
    category: "cloud"
  - pattern: "*.azure.com"
    name: "Azure"
    category: "cloud"
  - pattern: "*.microsoftonline.com"
    name: "Azure AD"
    category: "cloud"
  - pattern: "*.googleapis.com"
    name: "Google Cloud"
    category: "cloud"
  - pattern: "*.datadoghq.com"
    name: "Datadog"
    category: "cloud"

  # CDN
  - pattern: "*.cloudflare.com"
    name: "Cloudflare"
    category: "cdn"
  - pattern: "*.jsdelivr.net"
    name: "jsDelivr"
    category: "cdn"
  - pattern: "*.akamai.net"
    name: "Akamai"
    category: "cdn"
  - pattern: "*.fastly.net"
    name: "Fastly"
    category: "cdn"
